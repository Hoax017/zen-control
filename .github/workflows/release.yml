name: Build & release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_B64: ${{ secrets.ZEN_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Check server syntax
        run: node --check server.js && node --check web/app.js

      - name: Release builds must use the release key (same signature = updates work)
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_B64 == ''
        run: |
          echo "Missing secrets ZEN_KEYSTORE_B64 / ZEN_KEYSTORE_PASS / ZEN_KEY_ALIAS / ZEN_KEY_PASS"
          exit 1

      - name: Release signing key
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ZEN_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build helper APK and executables
        env:
          ZEN_KEYSTORE_PASS: ${{ secrets.ZEN_KEYSTORE_PASS }}
          ZEN_KEY_ALIAS: ${{ secrets.ZEN_KEY_ALIAS }}
          ZEN_KEY_PASS: ${{ secrets.ZEN_KEY_PASS }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export ZEN_VERSION="${GITHUB_REF_NAME#v}"
            export ZEN_VERSION_CODE="$GITHUB_RUN_NUMBER"
          fi
          ./helper/build.sh
          ./tools/build-exe.sh

      - uses: actions/upload-artifact@v4
        with:
          name: zen-control
          path: dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
